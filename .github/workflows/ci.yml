name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `shared` compiles to dist first; server and client both consume it as a
      # built package, so every step below depends on it.
      - run: npm run build -w shared

      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
